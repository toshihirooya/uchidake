name: Uchidake
options:
  bundleIdPrefix: com.toshihirooya
  # 文言の元は日本語。ほかの言語は Localizable.xcstrings / InfoPlist.xcstrings に足す
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
targets:
  Uchidake:
    type: application
    platform: iOS
    sources: [Uchidake]
    info:
      path: Uchidake/Info.plist
      properties:
        # アプリ名と許可ダイアログの文言は、言語ごとに InfoPlist.xcstrings で差し替わる（ここは日本語の元）
        CFBundleDisplayName: うちだけカメラ
        UILaunchScreen: {}
        # ローカルネットワーク利用の許可ダイアログに表示される文言
        NSLocalNetworkUsageDescription: 家の中にあるカメラと、映像を見る端末をつなぐために、ローカルネットワークを使用します。
        # Bonjourで広告・探索するサービス種別（MediaSecurity.serviceType と一致させる）
        NSBonjourServices:
          - _uchidake._udp
        NSCameraUsageDescription: この iPhone を見守りカメラにして家の中の別の端末に映像を送るため、また端末を追加するときに QR コードを読み取るためにカメラを使用します。
        NSMicrophoneUsageDescription: カメラのまわりの音を家の中の別の端末に送るため、また映像を見ながら話しかけるためにマイクを使用します。
        # 見る側が、アプリを閉じても音を聞き続けられるようにする
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.toshihirooya.uchidake
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 署名は fastlane match（fastlane/Fastfile）。実機向けだけ match のプロファイルを参照する
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: PU7N6T2J8N
      configs:
        Debug:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match Development com.toshihirooya.uchidake
        Release:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match AppStore com.toshihirooya.uchidake
  UchidakeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UchidakeTests]
    dependencies:
      - target: Uchidake
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Uchidake:
    build:
      targets:
        Uchidake: all
    run:
      config: Debug
    test:
      targets:
        - UchidakeTests
